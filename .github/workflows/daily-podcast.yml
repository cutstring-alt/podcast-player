name: Daily AI News Podcast

on:
  schedule:
    # 每天早上 8 点（北京时间）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install dashscope requests ffmpeg-python

      - name: Search AI news
        id: search
        run: |
          python << 'EOF'
          import os
          import json
          import requests
          from datetime import datetime

          news_items = []
          
          # HackerNews AI 相关
          try:
            r = requests.get(
              "https://hn.algolia.com/api/v1/search_by_date?query=AI&tags=story&hitsPerPage=10",
              timeout=15
            )
            if r.status_code == 200:
              data = r.json()
              for hit in data.get('hits', [])[:8]:
                title = hit.get('title', '')
                url = hit.get('url', f"https://news.ycombinator.com/item?id={hit.get('objectID')}")
                if title:
                  news_items.append(f"- {title}\n  来源: {url}")
          except Exception as e:
            print(f"HN error: {e}")
          
          date_str = datetime.now().strftime("%Y-%m-%d")
          news_content = f"# AI资讯 ({date_str})\n\n"
          news_content += "## 今日要闻\n\n"
          
          if news_items:
            for item in news_items[:10]:
                news_content += f"{item}\n\n"
          else:
            news_content += "暂无最新资讯，请稍后再试\n"
          
          os.makedirs("content", exist_ok=True)
          with open(f"content/{date_str}.md", "w", encoding="utf-8") as f:
            f.write(news_content)
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"date={date_str}\n")
          
          print(f"Generated news for {date_str}")
          print(f"Found {len(news_items)} items")
          if news_items:
            print("Sample:", news_items[0][:50])
          EOF

      - name: Generate TTS audio
        id: tts
        run: |
          python << 'EOF'
          import dashscope
          import urllib.request
          import subprocess
          import os
          from datetime import datetime

          dashscope.base_http_api_url = 'https://dashscope.aliyuncs.com/api/v1'

          date_str = os.environ.get('DATE', datetime.now().strftime("%Y-%m-%d"))
          content_file = f"content/{date_str}.md"
          
          if not os.path.exists(content_file):
            print(f"No content file for {date_str}")
            exit(0)
          
          with open(content_file, 'r', encoding='utf-8') as f:
            text = f.read()
          
          lines = text.split('\n')
          clean_lines = []
          for line in lines:
            line = line.strip()
            if line and not line.startswith('#') and not line.startswith('来源:') and not line.startswith('- '):
              clean_lines.append(line)
            elif line.startswith('- '):
              clean_lines.append(line.split('来源:')[0].strip())
          
          tts_text = ' '.join(clean_lines[:500])
          print(f"TTS text length: {len(tts_text)}")
          
          # 使用 MultiModalConversation API
          response = dashscope.MultiModalConversation.call(
              model="qwen3-tts-flash",
              api_key="${{ secrets.DASHSCOPE_API_KEY }}",
              text=tts_text,
              voice="Cherry",
              language_type="Chinese",
              stream=False
          )
          
          if response.status_code == 200:
              audio_url = response.output.audio.url
              print(f"Audio URL: {audio_url}")
              
              wav_path = f"content/{date_str}.wav"
              mp3_path = f"content/{date_str}.mp3"
              
              # 下载音频
              urllib.request.urlretrieve(audio_url, wav_path)
              
              # 转换为MP3
              subprocess.run(
                  ["ffmpeg", "-i", wav_path, "-b:a", "128k", mp3_path, "-y"],
                  capture_output=True
              )
              
              print(f"TTS generated: {mp3_path}")
          else:
              print(f"TTS error: {response.code} - {response.message}")
              exit(1)
          EOF
        env:
          DATE: ${{ steps.search.outputs.date }}

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add content/
          
          if git diff --cached --quiet; then
            echo "No content to commit"
            exit 0
          fi
          
          git commit -m "Update podcast: $(date +%Y-%m-%d)"
          git push
