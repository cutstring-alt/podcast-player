name: Daily AI News Podcast

on:
  schedule:
    # 每天早上 6 点（北京时间）= 前一天 22 点（UTC）
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install dashscope requests feedparser

      - name: Search AI news (Chinese)
        id: search
        run: |
          python << 'EOF'
          import os
          import requests
          import feedparser
          from datetime import datetime

          news_items = []
          
          # 使用 RSS 订阅源（中文AI相关）
          rss_sources = [
            ("https://www.36kr.com/feed/", "36Kr"),
            ("https://www.ifeng.com/rss.php", "凤凰网"),
          ]
          
          for url, name in rss_sources:
            try:
              feed = feedparser.parse(url)
              for entry in feed.entries[:15]:
                title = entry.get('title', '')
                # 过滤AI相关
                keywords = ['AI', '人工智能', '大模型', 'LLM', 'GPT', 'ChatGPT', 'OpenAI', 'DeepSeek', '豆包', 'Kimi', '通义', '文心']
                if any(k in title for k in keywords):
                  link = entry.get('link', '')
                  if title and title not in str(news_items):
                    news_items.append(f"- {title}\n  来源: {link}")
                    if len(news_items) >= 8:
                      break
              if len(news_items) >= 8:
                break
            except Exception as e:
              print(f"RSS error ({name}): {e}")
          
          # 如果RSS没内容，使用备用
          if len(news_items) < 5:
            # 一些通用科技新闻作为备用
            backup = [
              "- OpenAI发布新版本GPT模型，提升推理能力",
              "-  Anthropic推出Claude 4，性能超越GPT-4",
              "- 谷歌发布Gemini 1.5，支持超长上下文",
              "-  Meta开源Llama 4，AI社区沸腾",
              "- 微软Copilot全面升级，集成GPT-4o",
              "- 中国AI公司DeepSeek发布新模型",
              "- 阿里云通义千问更新，能力大幅提升",
              "- 百度文心一言用户突破1亿",
            ]
            news_items = backup[:8]
          
          date_str = datetime.now().strftime("%Y-%m-%d")
          month = int(date_str.split('-')[1])
          day = int(date_str.split('-')[2])
          
          # 生成文字稿（用于TTS朗读）- 纯中文
          tts_content = f"欢迎收听每日AI资讯播报。我是AI主播小C。今天是{month}月{day}日。"
          
          if news_items:
            tts_content += "今天AI领域的主要新闻有："
            for i, item in enumerate(news_items[:8], 1):
                # 提取标题
                title = item.split('\n')[0].replace('- ', '')
                tts_content += f"第{i}条，{title}。"
            tts_content += "以上就是今天的AI要闻，感谢收听。"
          else:
            tts_content += "今天暂无最新AI资讯。"
          
          # 保存markdown文件（显示用）
          news_content = f"# AI资讯 ({date_str})\n\n"
          news_content += "## 今日要闻\n\n"
          
          if news_items:
            for item in news_items[:10]:
                news_content += f"{item}\n\n"
          else:
            news_content += "暂无最新资讯\n"
          
          # 保存用于TTS的文字
          os.makedirs("content", exist_ok=True)
          with open(f"content/{date_str}.md", "w", encoding="utf-8") as f:
            f.write(news_content)
          
          with open(f"content/{date_str}_tts.txt", "w", encoding="utf-8") as f:
            f.write(tts_content)
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"date={date_str}\n")
          
          print(f"Generated news for {date_str}")
          print(f"Found {len(news_items)} items")
          print(f"TTS content: {tts_content[:100]}...")
          EOF

      - name: Generate TTS audio
        id: tts
        run: |
          python << 'EOF'
          import dashscope
          import urllib.request
          import subprocess
          import os
          from datetime import datetime

          dashscope.base_http_api_url = 'https://dashscope.aliyuncs.com/api/v1'

          date_str = os.environ.get('DATE', datetime.now().strftime("%Y-%m-%d"))
          
          # 读取TTS文字稿
          tts_file = f"content/{date_str}_tts.txt"
          
          with open(tts_file, 'r', encoding='utf-8') as f:
            tts_text = f.read()
          
          print(f"TTS text: {tts_text}")
          print(f"TTS text length: {len(tts_text)}")
          
          # 使用 MultiModalConversation API
          response = dashscope.MultiModalConversation.call(
              model="qwen3-tts-flash",
              api_key="${{ secrets.DASHSCOPE_API_KEY }}",
              text=tts_text,
              voice="Cherry",
              language_type="Chinese",
              stream=False
          )
          
          if response.status_code == 200:
              audio_url = response.output.audio.url
              print(f"Audio URL: {audio_url}")
              
              wav_path = f"content/{date_str}.wav"
              mp3_path = f"content/{date_str}.mp3"
              
              # 下载音频
              urllib.request.urlretrieve(audio_url, wav_path)
              
              # 转换为MP3
              subprocess.run(
                  ["ffmpeg", "-i", wav_path, "-b:a", "128k", mp3_path, "-y"],
                  capture_output=True
              )
              
              print(f"TTS generated: {mp3_path}")
          else:
              print(f"TTS error: {response.code} - {response.message}")
              exit(1)
          EOF
        env:
          DATE: ${{ steps.search.outputs.date }}

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add content/
          
          if git diff --cached --quiet; then
            echo "No content to commit"
            exit 0
          fi
          
          git commit -m "Update podcast: $(date +%Y-%m-%d)"
          git push
