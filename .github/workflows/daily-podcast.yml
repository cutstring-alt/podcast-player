name: Daily AI News Podcast

on:
  schedule:
    # 每天早上 8 点（北京时间）
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install dashscope requests ffmpeg-python

      - name: Search AI news
        id: search
        run: |
          python << 'EOF'
          import subprocess
          import json
          import os
          from datetime import datetime, timedelta

          # 获取近24小时的AI新闻
          result = subprocess.run(
            ["pip", "install", "-q", "brave-search"],
            capture_output=True
          )
          
          # 使用 Brave Search API 搜索
          # 这里用 curl 直接调用
          import requests
          
          # 搜索AI新闻
          headers = {"Accept": "application/json"}
          # 由于没有 Brave API key，我们使用 RSS 源作为替代
          
          # 尝试多个AI新闻源
          news_items = []
          
          # 方式1: 尝试 HackerNews AI 相关
          try:
            r = requests.get("https://hn.algolia.com/api/v1/search_by_date?query=AI&tags=story&hitsPerPage=10", timeout=10)
            if r.status_code == 200:
              data = r.json()
              for hit in data.get('hits', [])[:5]:
                title = hit.get('title', '')
                url = hit.get('url', f"https://news.ycombinator.com/item?id={hit.get('objectID')}")
                if title:
                  news_items.append(f"- {title}\n  来源: {url}")
          except Exception as e:
            print(f"HN error: {e}")
          
          # 方式2: TechCrunch RSS
          try:
            r = requests.get("https://techcrunch.com/category/artificial-intelligence/feed/", timeout=10)
            if r.status_code == 200:
              import re
              items = re.findall(r'<item><title><!\[CDATA\[(.*?)\]\]></title>.*?<link>(.*?)</link>', r.text)
              for title, url in items[:5]:
                if title and title not in str(news_items):
                  news_items.append(f"- {title}\n  来源: {url}")
          except Exception as e:
            print(f"TechCrunch error: {e}")
          
          # 写入新闻文件
          date_str = datetime.now().strftime("%Y-%m-%d")
          news_content = f"# AI资讯 ({date_str})\n\n"
          news_content += "## 今日要闻\n\n"
          
          if news_items:
            for i, item in enumerate(news_items[:10], 1):
                news_content += f"{item}\n\n"
          else:
            news_content += "暂无最新资讯\n"
          
          # 保存到 content 目录
          os.makedirs("content", exist_ok=True)
          with open(f"content/{date_str}.md", "w", encoding="utf-8") as f:
            f.write(news_content)
          
          # 输出给下一步
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
            f.write(f"date={date_str}\n")
            f.write(f"content={news_content}\n")
          
          print(f"Generated news for {date_str}")
          EOF

      - name: Generate TTS audio
        id: tts
        run: |
          python << 'EOF'
          import dashscope
          import urllib.request
          import subprocess
          import os
          from datetime import datetime

          dashscope.base_http_api_url = 'https://dashscope.aliyuncs.com/api/v1'

          # 读取新闻内容
          date_str = os.environ.get('DATE', datetime.now().strftime("%Y-%m-%d"))
          content_file = f"content/{date_str}.md"
          
          if not os.path.exists(content_file):
            print(f"No content file for {date_str}")
            exit(0)
          
          with open(content_file, 'r', encoding='utf-8') as f:
            text = f.read()
          
          # 提取纯文本用于播报（去掉标题和链接）
          lines = text.split('\n')
          clean_lines = []
          for line in lines:
            line = line.strip()
            if line and not line.startswith('#') and not line.startswith('来源:') and not line.startswith('- '):
              clean_lines.append(line)
            elif line.startswith('- '):
              # 保留条目但去掉链接
              clean_lines.append(line.split('来源:')[0].strip())
          
          tts_text = ' '.join(clean_lines[:500])  # 限制长度
        
          # 调用阿里云 TTS
          response = dashscope.MultiModalConversation.call(
              model="qwen3-tts-flash",
              api_key="sk-e3cc50552fcd446ea0f3556430aa7cfc",
              text=tts_text,
              voice="Cherry",
              language_type="Chinese",
              stream=False
          )
          
          if response.status_code == 200:
              audio_url = response.output.choices[0].message.audio.url
              
              # 下载并转换
              wav_path = f"content/{date_str}.wav"
              mp3_path = f"content/{date_str}.mp3"
              
              urllib.request.urlretrieve(audio_url, wav_path)
              
              # 转换为MP3
              subprocess.run(
                  ["ffmpeg", "-i", wav_path, "-b:a", "128k", mp3_path, "-y"],
                  capture_output=True
              )
              
              print(f"TTS generated: {mp3_path}")
              
              # 输出给下一步
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                f.write(f"audio={mp3_path}\n")
          else:
              print(f"TTS error: {response.code} - {response.message}")
              exit(1)
          EOF
        env:
          DATE: ${{ steps.search.outputs.date }}

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 添加新内容
          git add content/
          
          # 检查是否有更改
          if git diff --cached --quiet; then
            echo "No content to commit"
            exit 0
          fi
          
          # Commit
          git commit -m "Update podcast: $(date +%Y-%m-%d)"
          
          # Push（需要 GITHUB_TOKEN 或 PAT）
          # 由于这个是推送到同一个仓库，使用 GITHUB_TOKEN 可能有权限问题
          # 需要设置 repo 权限
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
