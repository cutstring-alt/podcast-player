<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 资讯播客</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #18181c;
            --bg-tertiary: #1f1f24;
            --border-color: #2a2a30;
            --text-primary: #fff;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --accent-primary: #6366f1;
            --accent-secondary: #a855f7;
            --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
        }
        
        .light-mode {
            --bg-primary: #f8fafc;
            --bg-secondary: #fff;
            --bg-tertiary: #f1f5f9;
            --border-color: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-primary: #0ea5e9;
            --accent-secondary: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #0ea5e9, #38bdf8);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            transition: background 0.3s, color 0.3s;
        }
        
        /* 左侧导航 - 日期列表 */
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .date-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }
        .date-list-title {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0 10px;
            margin-bottom: 10px;
        }
        .date-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 4px;
        }
        .date-item:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
        }
        .date-item.active {
            background: var(--accent-gradient);
            color: #fff;
        }
        .date-icon {
            font-size: 16px;
        }
        
        /* 主内容区 */
        .main {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 600;
        }
        
        /* 主题切换 */
        .theme-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s;
        }
        .theme-toggle:hover {
            background: var(--bg-tertiary);
        }
        .toggle-track {
            width: 44px;
            height: 24px;
            background: var(--border-color);
            border-radius: 12px;
            position: relative;
            transition: background 0.3s;
        }
        .toggle-thumb {
            width: 20px;
            height: 20px;
            background: var(--accent-gradient);
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
        }
        .light-mode .toggle-thumb {
            transform: translateX(20px);
        }
        .toggle-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        /* 播客卡片 */
        .podcast-card {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }
        .podcast-header {
            display: flex;
            gap: 24px;
            margin-bottom: 24px;
        }
        .podcast-cover {
            width: 180px;
            height: 180px;
            border-radius: 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            flex-shrink: 0;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.3);
        }
        .light-mode .podcast-cover {
            box-shadow: 0 8px 30px rgba(14, 165, 233, 0.3);
        }
        .podcast-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .podcast-label {
            font-size: 12px;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .podcast-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.2;
        }
        .podcast-meta {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        /* 播放器 */
        .player-container {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 20px;
            transition: background 0.3s;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            margin-bottom: 16px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent-gradient);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s;
        }
        .time-display {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 16px;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--border-color);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 18px;
        }
        .control-btn:hover {
            background: var(--accent-primary);
            color: #fff;
            transform: scale(1.05);
        }
        .control-btn.play {
            width: 56px;
            height: 56px;
            background: var(--accent-gradient);
            color: #fff;
        }
        .control-btn.play:hover {
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        .light-mode .control-btn.play:hover {
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
        }
        
        /* 文字内容 */
        .content-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border-color 0.3s;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .episode-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .episode-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .episode-item:hover {
            background: var(--border-color);
        }
        .episode-number {
            width: 32px;
            height: 32px;
            background: var(--accent-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
            color: #fff;
        }
        .episode-content {
            flex: 1;
        }
        .episode-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .episode-desc {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        /* 无内容 */
        .no-content {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .podcast-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- 左侧导航 -->
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">🎙️</div>
            <div class="logo-text">AI News</div>
        </div>
        
        <div class="date-list">
            <div class="date-list-title">选择日期</div>
            <div id="dateList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>
    
    <!-- 主内容区 -->
    <div class="main">
        <div class="header">
            <h1 class="page-title" id="pageTitle">AI 资讯播客</h1>
            <div class="theme-toggle" onclick="toggleTheme()">
                <span class="toggle-label">🌙</span>
                <div class="toggle-track">
                    <div class="toggle-thumb"></div>
                </div>
                <span class="toggle-label">☀️</span>
            </div>
        </div>
        
        <!-- 播客卡片 -->
        <div class="podcast-card" id="podcastCard">
            <div class="podcast-header">
                <div class="podcast-cover">🎙️</div>
                <div class="podcast-info">
                    <div class="podcast-label">AI News Podcast</div>
                    <div class="podcast-title" id="podcastTitle">加载中...</div>
                    <div class="podcast-meta" id="podcastMeta">--</div>
                </div>
            </div>
            
            <!-- 播放器 -->
            <div class="player-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">--:--</span>
                </div>
                <div class="controls">
                    <button class="control-btn" onclick="restartAudio()">⏮</button>
                    <button class="control-btn play" id="playBtn" onclick="togglePlay()">▶</button>
                    <button class="control-btn" onclick="replayAudio()">🔄</button>
                </div>
            </div>
        </div>
        
        <!-- 文字内容 -->
        <div class="content-section">
            <div class="section-title">
                <span>📝</span> 文字版内容
            </div>
            <div class="episode-list" id="episodeList">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>
    
    <audio id="audioPlayer"></audio>
    
    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        
        let isPlaying = false;
        let currentDate = null;
        
        // 初始化
        async function init() {
            await loadDateList();
            
            // 默认选择最新日期
            const dates = document.querySelectorAll('.date-item');
            if (dates.length > 0) {
                dates[0].click();
            }
        }
        
        // 加载日期列表
        async function loadDateList() {
            const dateList = document.getElementById('dateList');
            
            // 模拟从 content 目录加载日期列表
            // 实际部署时可改为从 GitHub API 获取
            const dates = [];
            
            // 尝试获取现有内容
            try {
                // 这里可以扩展为从 GitHub API 获取 content 目录的文件列表
                // 暂时使用静态方式
            } catch (e) {
                console.log('Using default dates');
            }
            
            // 生成最近7天的日期
            const today = new Date();
            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                dates.push(d);
            }
            
            let html = '';
            dates.forEach((d, idx) => {
                const dateStr = formatDateStr(d);
                const label = idx === 0 ? '今天' : (idx === 1 ? '昨天' : dateStr);
                html += `
                    <div class="date-item" data-date="${dateStr}" onclick="selectDate('${dateStr}')">
                        <span class="date-icon">📅</span>
                        <span>${label} - ${d.getMonth() + 1}月${d.getDate()}日</span>
                    </div>
                `;
            });
            
            dateList.innerHTML = html;
        }
        
        // 选择日期
        async function selectDate(dateStr) {
            // 更新选中状态
            document.querySelectorAll('.date-item').forEach(item => {
                item.classList.remove('active');
                if (item.dataset.date === dateStr) {
                    item.classList.add('active');
                }
            });
            
            currentDate = dateStr;
            await loadContent(dateStr);
        }
        
        // 加载内容
        async function loadContent(dateStr) {
            const podcastTitle = document.getElementById('podcastTitle');
            const podcastMeta = document.getElementById('podcastMeta');
            const episodeList = document.getElementById('episodeList');
            
            podcastTitle.textContent = '加载中...';
            podcastMeta.textContent = '--';
            episodeList.innerHTML = '<div class="loading">加载中...</div>';
            
            // 设置音频源
            audio.src = `content/${dateStr}.mp3`;
            
            // 更新标题
            const [year, month, day] = dateStr.split('-');
            podcastTitle.textContent = `AI 资讯 - ${month}月${day}日`;
            podcastMeta.textContent = 'AI 资讯播客';
            
            // 尝试加载文字内容
            try {
                // 尝试获取 markdown 内容
                // 这里使用 fetch 获取，实际部署时可改为从 GitHub API
                const response = await fetch(`content/${dateStr}.md`);
                if (response.ok) {
                    const text = await response.text();
                    renderContent(text);
                } else {
                    episodeList.innerHTML = '<div class="no-content">暂无内容</div>';
                }
            } catch (e) {
                // 如果是本地测试或没有内容，显示示例
                if (dateStr === new Date().toISOString().split('T')[0]) {
                    // 今天的示例内容
                    renderSampleContent();
                } else {
                    episodeList.innerHTML = '<div class="no-content">暂无内容</div>';
                }
            }
        }
        
        // 渲染内容
        function renderContent(markdown) {
            const episodeList = document.getElementById('episodeList');
            
            // 简单解析 markdown
            const lines = markdown.split('\n');
            let html = '';
            let count = 0;
            
            for (const line of lines) {
                if (line.startsWith('- ')) {
                    count++;
                    const content = line.substring(2).split('来源:');
                    const title = content[0].trim();
                    const source = content[1] ? content[1].trim() : '';
                    
                    html += `
                        <div class="episode-item">
                            <div class="episode-number">${count}</div>
                            <div class="episode-content">
                                <div class="episode-title">${title}</div>
                                ${source ? `<div class="episode-desc">${source}</div>` : ''}
                            </div>
                        </div>
                    `;
                }
            }
            
            if (count === 0) {
                html = '<div class="no-content">暂无内容</div>';
            }
            
            episodeList.innerHTML = html;
        }
        
        // 示例内容（当天没有内容时显示）
        function renderSampleContent() {
            const episodeList = document.getElementById('episodeList');
            episodeList.innerHTML = `
                <div class="episode-item">
                    <div class="episode-number">1</div>
                    <div class="episode-content">
                        <div class="episode-title">GitHub 发布新版本 Copilot</div>
                        <div class="episode-desc">来源: https://github.com</div>
                    </div>
                </div>
                <div class="episode-item">
                    <div class="episode-number">2</div>
                    <div class="episode-content">
                        <div class="episode-title">OpenAI 推出新模型 GPT-5</div>
                        <div class="episode-desc">来源: https://openai.com</div>
                    </div>
                </div>
                <div class="episode-item">
                    <div class="episode-number">3</div>
                    <div class="episode-content">
                        <div class="episode-title">Meta 开源新 AI 框架</div>
                        <div class="episode-desc">来源: https://meta.ai</div>
                    </div>
                </div>
            `;
        }
        
        // 音频控制
        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });
        
        audio.addEventListener('timeupdate', () => {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = percent + '%';
            currentTimeEl.textContent = formatTime(audio.currentTime);
        });
        
        audio.addEventListener('ended', () => {
            isPlaying = false;
            playBtn.textContent = '▶';
        });
        
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
            } else {
                audio.play();
                playBtn.textContent = '⏸';
            }
            isPlaying = !isPlaying;
        }
        
        function restartAudio() {
            audio.currentTime = 0;
            if (!isPlaying) {
                audio.play();
                playBtn.textContent = '⏸';
                isPlaying = true;
            }
        }
        
        function replayAudio() {
            audio.currentTime = 0;
            audio.play();
            playBtn.textContent = '⏸';
            isPlaying = true;
        }
        
        progressBar.addEventListener('click', (e) => {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        });
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }
        
        function formatDateStr(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }
        
        // 主题切换
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
        
        // 启动
        init();
    </script>
</body>
</html>
